<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echoes of the Clone Wars</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #020711;
    font-family: Arial, Helvetica, sans-serif;
}

#background {
    position: absolute;
    top: -2%;
    right: -2%;
    bottom: -2%;
    left: -2%;
    background-color: #020711;
    background-image: url("background.png");
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    -webkit-transform: scale(1.02);
    transform: scale(1.02);
    -webkit-animation: drift 18s ease-in-out infinite alternate;
    animation: drift 18s ease-in-out infinite alternate;
}

#overlay {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    pointer-events: none;
    background: -webkit-linear-gradient(top, rgba(1,5,14,0.08), rgba(1,5,14,0.18));
    background: linear-gradient(to bottom, rgba(1,5,14,0.08), rgba(1,5,14,0.18));
}

#status {
    position: absolute;
    left: 7%;
    right: 7%;
    bottom: 22px;
    min-height: 18px;
    padding: 9px 14px;
    color: #b9dbff;
    background: rgba(2,10,24,0.58);
    border: 1px solid rgba(90,170,255,0.38);
    border-radius: 4px;
    font-size: 12px;
    line-height: 18px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 0 12px rgba(75,155,255,0.65);
}

@-webkit-keyframes drift {
    from {
        -webkit-transform: scale(1.02) translateX(-0.2%);
        transform: scale(1.02) translateX(-0.2%);
    }
    to {
        -webkit-transform: scale(1.055) translateX(0.2%);
        transform: scale(1.055) translateX(0.2%);
    }
}

@keyframes drift {
    from {
        -webkit-transform: scale(1.02) translateX(-0.2%);
        transform: scale(1.02) translateX(-0.2%);
    }
    to {
        -webkit-transform: scale(1.055) translateX(0.2%);
        transform: scale(1.055) translateX(0.2%);
    }
}
</style>
</head>
<body>
<div id="background"></div>
<div id="overlay"></div>
<div id="status">Establishing Republic connection...</div>

<script type="text/javascript">
(function () {
    var statusElement = document.getElementById("status");
    var filesTotal = 0;
    var filesNeeded = 0;

    function safeText(value, fallback) {
        if (value === undefined || value === null || value === "") {
            return fallback || "";
        }
        return String(value);
    }

    function setStatus(text) {
        statusElement.textContent = safeText(text, "Establishing Republic connection...");
    }

    window.GameDetails = function (
        servername,
        serverurl,
        mapname,
        maxplayers,
        steamid,
        gamemode,
        volume,
        language
    ) {
        var server = safeText(servername, "Echoes of the Clone Wars");
        var map = safeText(mapname, "");
        setStatus(map ? server + " - " + map : server);
    };

    window.SetStatusChanged = function (text) {
        setStatus(text);
    };

    window.DownloadingFile = function (fileName) {
        var file = safeText(fileName, "");
        setStatus(file ? "Downloading Republic asset: " + file : "Downloading Republic asset...");
    };

    window.SetFilesTotal = function (total) {
        filesTotal = parseInt(total, 10) || 0;
    };

    window.SetFilesNeeded = function (needed) {
        filesNeeded = parseInt(needed, 10) || 0;
        if (filesTotal > 0) {
            var completed = filesTotal - filesNeeded;
            if (completed < 0) completed = 0;
            setStatus("Synchronizing Republic assets: " + completed + " / " + filesTotal);
        }
    };
}());
</script>
</body>
</html>

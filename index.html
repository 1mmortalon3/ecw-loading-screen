<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echoes of the Clone Wars</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020711;color:#eef7ff;font-family:Arial,Helvetica,sans-serif}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(2,8,20,.88),rgba(5,20,48,.35),rgba(2,8,20,.78)),url('assets/background.jpg') center/cover no-repeat;transform:scale(1.03);animation:drift 18s ease-in-out infinite alternate}
body:after{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(75,170,255,.025) 0,rgba(75,170,255,.025) 1px,transparent 1px,transparent 4px);pointer-events:none}
@keyframes drift{from{transform:scale(1.03) translateX(-.5%)}to{transform:scale(1.08) translateX(.5%)}}
.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw}
.crest{width:110px;height:110px;border:2px solid #64adff;border-radius:50%;box-shadow:0 0 35px rgba(70,150,255,.45);display:grid;place-items:center;font-weight:900;font-size:42px;letter-spacing:2px;background:rgba(4,18,44,.72)}
h1{font-size:clamp(38px,5.2vw,86px);line-height:.9;margin:24px 0 12px;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 28px rgba(70,145,255,.7)}
h1 span{display:block;font-size:.48em;letter-spacing:.22em;color:#b9d9ff;margin-bottom:10px}
.tag{letter-spacing:.42em;text-transform:uppercase;color:#a9cdf5;font-size:clamp(11px,1.05vw,18px);margin-bottom:50px}
.card{width:min(860px,86vw);padding:18px 22px;border:1px solid rgba(90,170,255,.75);background:rgba(4,17,42,.78);box-shadow:0 0 35px rgba(20,90,180,.25);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.status{display:flex;justify-content:space-between;gap:20px;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:#c8e3ff}.bar{height:12px;margin-top:14px;border:1px solid #5faaff;background:#06152d;padding:2px}.fill{height:100%;width:8%;background:linear-gradient(90deg,#1f7fff,#8de6ff);box-shadow:0 0 18px #3aa0ff;transition:width .35s ease}
.details{margin-top:16px;color:#8fb8e6;font-size:13px;letter-spacing:.1em}.quote{position:absolute;bottom:28px;letter-spacing:.5em;text-transform:uppercase;color:#9ac4ef;font-size:12px}
</style>
</head>
<body><main class="wrap"><div class="crest">GR</div><h1><span>Echoes of the</span>Clone Wars</h1><div class="tag">Brothers in arms • For the Republic</div><section class="card"><div class="status"><span id="status">Establishing Republic connection…</span><span id="percent">8%</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="details" id="details">Preparing deployment package</div></section><div class="quote">A Helix Star Wars roleplay experience</div></main>
<script>
let total=100, needed=92;
function update(){const complete=Math.max(0,total-needed),pct=Math.max(8,Math.min(100,Math.round(complete/Math.max(total,1)*100)));document.getElementById('fill').style.width=pct+'%';document.getElementById('percent').textContent=pct+'%'}
function GameDetails(servername,serverurl,mapname,maxplayers,steamid,gamemode){document.getElementById('details').textContent=(servername||'Echoes of the Clone Wars')+' • '+(mapname||'Republic deployment zone')}
function SetFilesTotal(n){total=Number(n)||100;update()}function SetFilesNeeded(n){needed=Number(n)||0;update()}function SetStatusChanged(s){document.getElementById('status').textContent=s||'Loading…'}function DownloadingFile(file){document.getElementById('status').textContent='Downloading Republic asset';document.getElementById('details').textContent=file||''}
update();
</script></body></html>
